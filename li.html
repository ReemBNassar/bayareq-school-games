<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>قصة: الحرية أجمل 🕊️</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Changa', 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 55%, #FF99AC 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow-x: hidden;
        }

        #page-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #0f172a;
            opacity: 0;
            pointer-events: none;
            transition: opacity 1.2s ease-in-out;
            z-index: 9999;
        }

        #page-overlay.fade-out-active {
            opacity: 1;
            pointer-events: all;
        }

        .story-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            padding: 20px 15px;
            text-align: center;
            border: 5px solid #FFD166;
            position: relative;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-badge {
            background: linear-gradient(45deg, #FF6B6B, #4ECDC4);
            color: white;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 1.25rem;
            font-weight: 900;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
        }

        .video-wrapper {
            position: relative;
            width: 100%;
            border-radius: 22px;
            margin-bottom: 15px;
        }

        .slide-frame {
            width: 100%;
            height: 260px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            background: #000;
            border: 4px solid #6C5CE7;
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.3);
        }

        .slide-media {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
        }

        .slide-media.fade-in {
            opacity: 1;
        }

        .floating-emoji {
            position: absolute;
            font-size: 1.8rem;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
        }

        .e1 {
            top: -12px;
            right: -8px;
            animation: floatAnim 2.5s infinite ease-in-out;
        }

        .e2 {
            bottom: -10px;
            left: -8px;
            animation: floatAnim 3s infinite ease-in-out 0.5s;
        }

        .e3 {
            top: 40%;
            left: -15px;
            animation: floatAnim 2s infinite ease-in-out 1s;
        }

        @keyframes floatAnim {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(10deg);
            }
        }

        .story-bubble {
            background: #FFF9A6;
            border: 3px dashed #FFB703;
            border-radius: 20px;
            padding: 15px;
            font-size: 1.1rem;
            color: #2B2D42;
            margin-bottom: 15px;
            line-height: 1.6;
            font-weight: 700;
            box-shadow: 0 5px 10px rgba(0, 0, 0, 0.05);
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .controls-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            align-items: center;
        }

        .choice-btn {
            background: linear-gradient(145deg, #06D6A0, #118AB2);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 1.1rem;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 800;
            box-shadow: 0 6px 0 #008F68;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            max-width: 320px;
        }

        .choice-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #008F68;
        }

        .replay-btn {
            background: linear-gradient(145deg, #FFB703, #FB8500);
            box-shadow: 0 6px 0 #D00000;
        }

        .replay-btn:active {
            box-shadow: 0 2px 0 #D00000;
        }

        .game-btn {
            background: linear-gradient(45deg, #FF007F, #FF5E00);
            box-shadow: 0 6px 0 #99004C;
            animation: pulse 1.5s infinite;
        }

        .game-btn:active {
            box-shadow: 0 2px 0 #99004C;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.03);
            }
        }

        @media (max-height: 650px) {
            .slide-frame {
                height: 210px;
            }

            .story-bubble {
                font-size: 0.98rem;
                padding: 10px;
            }

            .title-badge {
                font-size: 1.1rem;
                margin-bottom: 10px;
            }
        }
    </style>
</head>

<body>

    <div id="page-overlay"></div>

    <div class="story-card">
        <div class="title-badge">✨ قصة: الحرية أجمل ✨</div>

        <div class="video-wrapper">
            <div class="floating-emoji e1">🐣</div>
            <div class="floating-emoji e2">🎵</div>
            <div class="floating-emoji e3">🌟</div>

            <div class="slide-frame" id="media-container">

            </div>
        </div>

        <div class="story-bubble" id="story-text">
            اضغط "بدء التشغيل ▶" لمتابعة القصة...
        </div>

        <div class="controls-container" id="controls-container">
            <button class="choice-btn" onclick="startStory()" id="play-btn">بدء التشغيل ▶</button>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const storyData = [
            {video: "v1.mp4", text: "شَعَرَ عُصْفُورٌ بِالْجُوعِ وَالْعَطَشِ، فَأَخَذَ يَبْحَثُ عَنْ طَعَامٍ وَشَرَابٍ.", duration: 7000},
            {video: "v1.mp4", text: "طَارَ الْعُصْفُورُ بَعِيداً، وَرَأَى عَلَى شُرْفَةِ أَحَدِ الْبُيُوتِ بُلْبُلاً فِي قَفَصٍ جَمِيلٍ.", duration: 8000},
            {video: "v1.mp4", text: "قَالَ الْعُصْفُورُ: مَا أَجْمَلَ حَيَاتَكَ هُنَا! تَأْكُلُ وَتَشْرَبُ بِأَمَانٍ.", duration: 5000},
            {video: "v2.mp4", text: "قَالَ الْبُلْبُلُ: وَلَكِنِّي حَزِينٌ، فَأَنَا مَسْجُونٌ.. الْحُرِّيَّةُ هِيَ الأَجْمَلُ يَا صَدِيقِي.", duration: 10000}
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let currentVideoFile = "";
        let storyTimer = null;

        const videoSpeed = 0.5;

        const audioPlayer = document.getElementById("audio-player");


        const birdAudio = new Audio("birdsound.mp3");
        const mediaContainer = document.getElementById("media-container");


        audioPlayer.onended = function () {
            clearTimeout(storyTimer);
            finishStoryOptions();
        };

        function playScene() {
            if (!isPlaying) return;

            const item = storyData[currentIndex];
            document.getElementById("story-text").innerText = item.text;

            if (currentVideoFile !== item.video) {
                const oldVideo = mediaContainer.querySelector("video");

                const newVideo = document.createElement("video");
                newVideo.src = item.video;
                newVideo.className = "slide-media";
                newVideo.muted = true;
                newVideo.loop = false;
                newVideo.setAttribute("playsinline", "true");
                newVideo.playbackRate = videoSpeed;

                mediaContainer.appendChild(newVideo);
                newVideo.play().catch(() => { });

                setTimeout(() => {
                    newVideo.classList.add("fade-in");
                    if (oldVideo) {
                        oldVideo.classList.remove("fade-in");
                        setTimeout(() => oldVideo.remove(), 1200);
                    }
                }, 50);

                currentVideoFile = item.video;
            } else {
                const activeVideo = mediaContainer.querySelector(".fade-in");
                if (activeVideo) {
                    activeVideo.playbackRate = videoSpeed;
                    activeVideo.play().catch(() => { });
                }
            }

            clearTimeout(storyTimer);
            storyTimer = setTimeout(() => {
                currentIndex++;
                if (currentIndex < storyData.length) {
                    playScene();
                }
            }, item.duration);
        }

        function finishStoryOptions() {
            isPlaying = false;
            currentIndex = 0;
            currentVideoFile = "";


            birdAudio.currentTime = 0;
            birdAudio.play().catch((err) => console.log("خطأ تشغيل صوت العصفور:", err));


            document.getElementById("story-text").innerHTML = "🎉 نهاية القصة الرائعة!<br>« الحُرِّيَّةُ هِيَ الأَجْمَلُ » 🕊️<br>";

            const controls = document.getElementById("controls-container");
            controls.style.display = "flex";
            controls.innerHTML = "";


            setTimeout(() => {
                birdAudio.pause();
                document.getElementById("story-text").innerHTML = "🎉 نهاية القصة الرائعة!<br>« الحُرِّيَّةُ هِيَ الأَجْمَلُ » 🕊️";
                controls.innerHTML = `
                    <button class="choice-btn replay-btn" onclick="restartStory()">إعادة القصة 🔄</button>
                    <button class="choice-btn game-btn" onclick="goToGame()">الانتقال إلى اللعبة 🎮</button>
                `;
            }, 5000);
        }

        function restartStory() {
            birdAudio.pause();
            const controls = document.getElementById("controls-container");


            isPlaying = true;
            currentIndex = 0;
            currentVideoFile = "";
            mediaContainer.innerHTML = "";

            audioPlayer.src = "ممتاز.mp3";
            audioPlayer.currentTime = 0;
            audioPlayer.play().catch(() => { });

            playScene();
        }

        function goToGame() {
            audioPlayer.pause();
            birdAudio.pause();

            const overlay = document.getElementById("page-overlay");
            overlay.classList.add("fade-out-active");

            setTimeout(() => {
                window.location.href = "game.html";
            }, 1200);
        }

        function startStory() {
            birdAudio.load();
            isPlaying = true;

            document.getElementById("controls-container").style.display = "none";

            if (currentIndex === 0 && (!audioPlayer.src || audioPlayer.src === "")) {
                audioPlayer.src = "ممتاز.mp3";
                audioPlayer.currentTime = 0;
            }
            audioPlayer.play().catch(() => { });

            playScene();
        }
    </script>

</body>

</html>
